<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <script>
      try {
        const cachedStatus = localStorage.getItem('status')
        const cachedSystemName = cachedStatus
          ? JSON.parse(cachedStatus)?.system_name
          : null
        if (typeof cachedSystemName === 'string' && cachedSystemName.trim()) {
          document.title = cachedSystemName
          document
            .querySelector('meta[name="title"]')
            ?.setAttribute('content', cachedSystemName)
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
